
name: Build Starlight APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'starlight-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -o starlight-source.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Starlight-Messenger-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
